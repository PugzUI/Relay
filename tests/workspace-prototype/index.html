<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Relay · X6 workspace prototype</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/app.css">
  <link rel="stylesheet" href="relay-style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>RELAY</h1>
    <div class="toolbar">
      <button id="post" title="Post three fixture packages">Post work</button>
      <button id="fit" title="Fit topology">Fit</button>
      <button id="save">Save layout</button>
      <button id="restore">Restore</button>
      <button id="reset" title="Reset layout">Reset</button>
      <button id="disconnect">Disconnect</button>
    </div>
    <span class="fixture">ISOLATED STORE · LOCAL FIXTURE WORKERS</span>
  </header>
  <div id="connection" role="status">Connecting…</div>
  <main id="workspace" aria-label="Dockable Relay workspace"></main>
  <footer><span>X6 3.1.8 / Dockview 8.5.1 / xterm.js 6.0</span><span>Real Relay claims · scoped process consoles · no AI-agent attachment or OS shell</span></footer>
  <script type="module" src="app.mjs"></script>
</body>
</html>
